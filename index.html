<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Certification Mockup</title>

  <style>
    :root {
      --bg:#1e1e1e;
      --muted:#9aa1a6;
      --border:rgba(255,255,255,0.12);
      --accent:#0ea5a3;
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }

    body {
      margin:0;
      background:var(--bg);
      color:#eee;
    }

    /* HEADER */
    header {
      height:56px;
      display:flex;
      align-items:center;
      gap:18px;
      padding:0 22px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(#161616,#191919);
    }

    .logo {
      width:36px;
      height:36px;
      border-radius:4px;
      background:#fff;
      color:#111;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
    }

    nav.top {
      display:flex;
      gap:18px;
      color:var(--muted);
      font-size:14px;
    }

   .panel {
  width:100%;
  margin:0;
  padding:20px;
}

    /* PAGE TITLE */
    h1 {
      font-size:28px;
      font-weight:700;
      margin:0 0 6px 0;
    }

    .issued {
      color:var(--muted);
      margin-bottom:18px;
      font-size:15px;
    }

    /* AVATAR + NAME */
    .profile-row {
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:24px;
    }

    .circle-avatar {
      width:50px;
      height:50px;
      border-radius:50%;
      overflow:hidden;
    }

    .circle-avatar img {
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:50%;
    }

    .profile-name {
      font-size:17px;
      font-weight:600;
      color:#8ebaff;
      cursor:pointer;
    }

    hr {
      border:0;
      border-top:1px solid var(--border);
      margin:24px 0;
    }

    /* MAIN TWO-COLUMN LAYOUT */
    .grid {
      display:grid;
      grid-template-columns: 1fr 300px;
      gap:32px;
      align-items:flex-start;
    }

    /* LEFT SIDE CONTENT (certificate image + details) */
    .certificate-container {
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .certificate-container img {
      width:auto;
      max-width:900px;
      height:auto;
      display:block;
      object-fit:contain;
    }

    /* RIGHT SIDEBAR */
    aside.sidebar {
      padding:0;
    }

    .badge-img {
      width:120px;
      height:auto;
      display:block;
      margin-bottom:14px;
    }

    .status-label {
      font-weight:700;
      color:var(--muted);
      margin-top:10px;
    }

    .status-pill {
      padding:6px 12px;
      background:#274e3b;
      color:#bff3d9;
      border-radius:999px;
      margin-right:6px;
      font-size:13px;
    }

    .verif-pill {
      padding:6px 12px;
      background:#153a5a;
      color:#cfe8ff;
      border-radius:999px;
      font-size:13px;
    }

    .meta-list {
      margin-top:14px;
      border-top:1px solid var(--border);
      padding-top:12px;
      font-size:14px;
    }

    .meta-list .row {
      padding:10px 0;
      border-bottom:1px solid rgba(255,255,255,0.08);
      color:var(--muted);
    }

    a.view {
      display:inline-block;
      margin-top:14px;
      color:#8ea0ff;
      text-decoration:none;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">IMAGE</div>
  <nav class="top">
    <div>Learn</div>
    <div>Documentation</div>
    <div>Training</div>
    <div>Q&A</div>
    <div>Topics</div>
  </nav>
  <div style="margin-left:auto;color:var(--muted);font-weight:600">MM</div>
</header>

<div class="panel">

  <h1>Microsoft Certified: Power BI Data Analyst Associate</h1>

  <div class="issued">Issued by Microsoft on December 7, 2025 to:</div>

  <div class="profile-row">
    <div class="circle-avatar">
      <img src="circle.png" alt="Profile">
    </div>
    <div class="profile-name">Makena Mwenda</div>
  </div>

  <hr>

  <!-- TWO COLUMN LAYOUT -->
  <div class="grid">

    <!-- LEFT: CERTIFICATE -->
    <div class="certificate-container">
      <img src="webimage.png" alt="Certificate Image">
    </div>

    <!-- RIGHT: SIDEBAR -->
    <aside class="sidebar">

      <img class="badge-img" src="badge.png" alt="Badge">

      <div class="status-label">Status</div>

      <span class="status-pill">Active</span>
      <span class="verif-pill">Online Verifiable</span>

      <div class="meta-list">
        <div class="row">Text</div>
        <div class="row">Text</div>
        <div class="row">Text</div>
        <div class="row">Text</div>
      </div>

      <a class="view" href="#">View certification page</a>

    </aside>

  </div>

</div>

</body>
</html>
