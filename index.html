<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mockup Landing</title>

  <style>
    :root {
      --bg:#1e1e1e;
      --muted:#9aa1a6;
      --border:rgba(255,255,255,0.06);
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }

    body {
      margin:0;
      background:var(--bg);
      color:#eee;
    }

    header {
      height:56px;
      display:flex;
      align-items:center;
      gap:18px;
      padding:0 22px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(#161616,#191919);
    }

    .logo {
      width:36px;
      height:36px;
      border-radius:4px;
      background:#fff;
      color:#111;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
    }

    nav.top {
      display:flex;
      gap:18px;
      color:var(--muted);
      font-size:14px;
    }

    /* Panel wrapper */
    .panel {
      max-width:1200px;
      margin:0 auto;
    }

    /* CIRCLE AVATAR */
    .circle-avatar {
      width:90px;
      height:90px;
      border-radius:50%;
      overflow:hidden;
      margin:20px 0 0 20px;
    }
    .circle-avatar img {
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:50%;
      display:block;
    }

    /* HERO AREA — MATCH MOCKUP */
    .hero {
      width:100%;
      padding:60px 0 40px 0;  /* spacing to match screenshot */
      display:flex;
      justify-content:center;
      align-items:center;
      background:transparent;
    }
    .hero img {
      width:auto;
      max-width:900px; /* IMPORTANT — adjust if needed */
      height:auto;
      object-fit:contain;
      display:block;
    }

    /* Main content layout */
    .content {
      display:flex;
      gap:28px;
      padding:22px;
      max-width:1200px;
      margin:0 auto;
    }

    main { flex:1; }

    .left-meta {
      margin-top:18px;
    }
    .left-meta p {
      color:var(--muted);
      margin:6px 0;
    }

    /* SIDEBAR */
    aside.sidebar {
      width:280px;
      padding:18px;
      border-left:1px solid var(--border);
    }

    .avatar-square {
      width:120px;
      height:120px;
      background:#fff;
      color:#111;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      margin-bottom:12px;
    }

    .status { display:flex; align-items:center; gap:10px; margin:8px 0; }
    .badge {
      padding:6px 10px;
      border-radius:999px;
      font-size:13px;
      background:#274e3b;
      color:#bff3d9;
    }
    .verif {
      padding:6px 10px;
      border-radius:999px;
      font-size:13px;
      background:#153a5a;
      color:#cfe8ff;
    }

    .meta-list {
      margin-top:14px;
      border-top:1px solid var(--border);
      padding-top:12px;
    }
    .meta-list .row {
      padding:10px 0;
      border-bottom:1px solid rgba(255,255,255,0.02);
      color:var(--muted);
    }

    a.view {
      color:#8ea0ff;
      text-decoration:none;
      margin-top:12px;
      display:inline-block;
    }

    footer {
      height:80px;
      background:#08232b;
      margin-top:36px;
      border-top:1px solid rgba(255,255,255,0.02);
      display:flex;
      align-items:center;
      color:#bfcfd6;
    }

    .footer-inner {
      max-width:1200px;
      margin:0 auto;
      padding:16px;
      display:flex;
      gap:36px;
      font-size:14px;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">IMAGE</div>
    <nav class="top">
      <div>Learn</div>
      <div>Documentation</div>
      <div>Training</div>
      <div>Q&A</div>
      <div>Topics</div>
    </nav>
    <div style="margin-left:auto;color:var(--muted);font-weight:600">MM</div>
  </header>

  <div class="panel">

    <!-- Avatar -->
    <div class="circle-avatar">
      <img src="circle.png" alt="Profile">
    </div>

    <!-- Certificate Section -->
    <div class="hero">
      <img src="webimage.png" alt="Certificate">
    </div>

    <div class="content">

      <main>
        <div class="left-meta">
          <h3>Text</h3>
          <p>Text</p>
          <p>Text</p>
          <p>Text</p>
        </div>
      </main>

      <aside class="sidebar">
        <div class="avatar-square">IMAGE</div>

        <div class="status">
          <div style="font-weight:700;color:var(--muted)">Status</div>
          <div class="badge">Active</div>
          <div class="verif">Online Verifiable</div>
        </div>

        <div class="meta-list">
          <div class="row">Text</div>
          <div class="row">Text</div>
          <div class="row">Text</div>
          <div class="row">Text</div>
          <a class="view" href="#">View certification page</a>
        </div>
      </aside>

    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <div>Text</div>
      <div>Text</div>
      <div>Text</div>
      <div>Text</div>
      <div>Text</div>
      <div>Text</div>
      <div>Text</div>
      <div>Text</div>
      <div>Text</div>
    </div>
  </footer>

</body>
</html>
